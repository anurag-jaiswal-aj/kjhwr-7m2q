services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gridbricks-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - PORT=8000
      - DATABASE_PATH=/app/backend/data/analytics.db
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - analytics_data:/app/backend/data
    networks:
      - gridbricks-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridbricks-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gridbricks-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  analytics_data:
    driver: local

networks:
  gridbricks-net:
    driver: bridge
